name: Optimize remaining homepage cards
on:
  push:
    branches: [optimize-remaining-home-images-20261115]
    paths: ['.github/workflows/optimize-remaining-home-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-remaining-home-images-20261115
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate resized WebP and update homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          html=Path('index.html')
          data=html.read_text()
          for name,width in [('12-optimized',760),('90378',560)]:
              source=Path(name+'.webp')
              target=Path(name+'-card.webp')
              assert source.is_file()
              with Image.open(source) as original:
                  im=ImageOps.exif_transpose(original).convert('RGB')
                  im.thumbnail((width,1200))
                  w,h=im.size
                  im.save(target,'WEBP',quality=74,method=6)
              pattern=r'(<img\s+src=")'+re.escape(name)+r'(\.webp"[^>]*?\bwidth=")\d+("\s+height=")\d+(")'
              data,count=re.subn(pattern,lambda m:m.group(1)+name+'-card'+m.group(2)+str(w)+m.group(3)+str(h)+m.group(4),data)
              assert count>=1,(name,count)
              print(name, 'optimized bytes:',target.stat().st_size,'references:',count)
          html.write_text(data)
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 12-optimized-card.webp 90378-card.webp
          git diff --cached --quiet || (git commit -m "Compress remaining homepage card photos" && git push)
