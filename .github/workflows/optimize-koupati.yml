name: Optimize Koupati images
on:
  push:
    paths:
      - '.github/workflows/optimize-koupati.yml'
      - 'scripts/optimize_koupati_images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/optimize_koupati_images.py
      - name: Validate and commit optimized assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              for src in re.findall(r'<img\b[^>]*\bsrc="([^"]+)"',s):
                  if src and not src.startswith(('http:', 'https:', 'data:')) and not Path(src).exists():
                      raise SystemExit(f'Missing image {src} in {p}')
          print('All referenced local image files exist')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*-optimized.webp' 'images/*-optimized.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Optimize image assets and set intrinsic image dimensions"
            git push
          fi
