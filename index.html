      });

      lucide.createIcons();

      document.body.style.overflow = "auto";

      currentPhotoIndex += direction;
      if (currentPhotoIndex < 0) currentPhotoIndex = galleryData.length - 1;
      if (currentPhotoIndex >= galleryData.length) currentPhotoIndex = 0;
      updateLightboxDisplay();
      renderLightboxThumbnails();

    function updateLightboxDisplay() {

      lightboxCounter.textContent = `${photo.id + 1}/${galleryData.length}`;
      lightboxCategory.textContent = photo.category.toUpperCase();

    function renderLightboxThumbnails() {
      lightboxThumbnails.innerHTML = "";

        thumb.alt = photo.title;

          renderLightboxThumbnails();
        };

      waypoints.forEach((wp, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-2.5 rounded-xl border border-slate-200 bg-white hover:border-stb-red hover:bg-stb-lightred/30 transition text-xs flex items-center justify-between group";
        btn.onclick = () => {
          map.flyTo(wp.coords, 14, { duration: 1.2 });
          markers[idx].openPopup();
        };

        btn.innerHTML = `
          <div>
            <span class="font-bold text-slate-800 group-hover:text-stb-red transition block">${wp.name}</span>
            <span class="text-[11px] text-slate-500 line-clamp-1">${wp.desc}</span>
          </div>
          <i data-lucide="navigation" class="w-3.5 h-3.5 text-slate-400 group-hover:text-stb-red shrink-0 ml-2"></i>
        `;
        container.appendChild(btn);
      });

      lucide.createIcons();
    }

    // Initial Load Calls
    window.addEventListener("load", () => {
      renderGallery(galleryData);
      initMap();
    });
  </script>
</body>
</html>
